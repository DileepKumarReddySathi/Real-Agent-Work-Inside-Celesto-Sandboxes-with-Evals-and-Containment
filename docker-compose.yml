services:
  ledger:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://ledger:ledger@ledger:5432/ledger
      API_PORT: 8080
      CELESTO_PROVIDER: cloud
      CELESTO_API_KEY: replace-with-celesto-api-key
      LLM_API_KEY: replace-with-llm-api-key
      LLM_MODEL: gpt-4o-mini
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
